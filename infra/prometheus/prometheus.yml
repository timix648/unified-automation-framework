# Prometheus scrape config for UAF.
# The backend already exposes Prometheus metrics at /metrics (see
# app/services/metrics.py). This wires a scraper to it. To actually run it,
# add a `prometheus` service to the compose file using this config, e.g.:
#
#   prometheus:
#     image: prom/prometheus:latest
#     volumes:
#       - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
#     ports: ["9090:9090"]
#     networks: [uaf-network]
#
# UAF exports metrics in Prometheus format at /api/metrics; this file configures
# the scrape. Visualisation on top (Grafana or otherwise) is deliberately out of
# scope -- the metrics endpoint is the deliverable.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: uaf-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["uaf-backend:8000"]
        labels:
          service: uaf
          component: backend
